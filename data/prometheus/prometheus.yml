global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'rackdoc-dcim-cmdb'

scrape_configs:
  - job_name: 'rackdoc_backend_collector'
    scrape_interval: 15s
    metrics_path: '/api/v1/metrics'
    authorization:
      credentials_file: '/etc/prometheus/dynamic/automation_api_key'
    static_configs:
      - targets: ['rackdoc-backend:8000']
        labels:
          collector: 'rackdoc-background-engine'

  - job_name: 'rackdoc_dynamic_host_exporters'
    tls_config:
      insecure_skip_verify: true
    file_sd_configs:
      - files:
          - '/etc/prometheus/dynamic/targets_*.json'
        refresh_interval: 15s
