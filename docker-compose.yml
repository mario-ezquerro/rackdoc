services:
  rackdoc-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cloudresources/rackdoc-backend:latest
    container_name: rackdoc-backend
    hostname: rackdoc-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/rackdoc.db}
      # Sin valores por defecto a propósito: un secreto compartido conocido
      # equivale a no tener autenticación. Defínelos en el fichero .env.
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_TTL_MINUTES=${JWT_TTL_MINUTES:-480}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:${FRONTEND_PORT:-8181},http://127.0.0.1:${FRONTEND_PORT:-8181}}
      - PING_INTERVAL_SECONDS=${PING_INTERVAL_SECONDS:-60}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://rackdoc-prometheus:9090}
      - PROMETHEUS_PUBLIC_URL=${PROMETHEUS_PUBLIC_URL:-http://localhost:9090}
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rackdoc.local}
    ports:
      - "${BACKEND_PORT:-8180}:8000"

  rackdoc-prometheus:
    image: prom/prometheus:latest
    container_name: rackdoc-prometheus
    hostname: rackdoc-prometheus
    restart: unless-stopped
    user: "0:0"
    command:
      - "--config.file=/etc/prometheus/dynamic/prometheus.yml"
      - "--storage.tsdb.path=/etc/prometheus/dynamic/tsdb"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./data/prometheus:/etc/prometheus/dynamic
    depends_on:
      - rackdoc-backend
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  rackdoc-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cloudresources/rackdoc-frontend:latest
    container_name: rackdoc-frontend
    hostname: rackdoc-frontend
    restart: unless-stopped
    depends_on:
      - rackdoc-backend
      - rackdoc-prometheus
    ports:
      - "${FRONTEND_PORT:-8181}:80"

